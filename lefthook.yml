pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      exclude:
        - "v1/**"
      run: bunx oxlint --deny-warnings {staged_files}
    - name: secrets
      skip:
        - run: "! command -v gitleaks"
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: conventional commit
      # Matches `type(scope)!: subject`, plus git's own merge and revert subjects.
      run: >-
        head -n 1 {1} | grep -qE '^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+|Merge .+|Revert ".+")$' || { echo "Commit subject must be a conventional commit, such as feat(contract): add issue schemas"; exit 1; }
