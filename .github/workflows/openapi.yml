name: openapi

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contract/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  breaking-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the base document
        # The first pull request that adds the document has no base to compare with, so it compares with itself.
        run: git show "origin/${{ github.base_ref }}:apps/api/openapi.json" > base-openapi.json || cp apps/api/openapi.json base-openapi.json
      - name: Fail on breaking changes
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: base-openapi.json
          revision: apps/api/openapi.json
          fail-on: ERR
