name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and run npm publish --dry-run without publishing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        run: npm install --global npm@11
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run --filter './packages/*' build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: bun run release --dry-run
      - name: Version pull request or publish
        if: github.event_name == 'push' || !inputs.dry-run
        uses: changesets/action@v1
        with:
          version: bun run changeset version
          publish: bun run release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
