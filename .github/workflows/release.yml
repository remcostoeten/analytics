name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and run npm publish --dry-run without publishing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        run: npm install --global npm@11
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run --filter './packages/*' build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: bun run release --dry-run
      - name: Find pending changesets
        id: pending
        if: github.event_name == 'push' || !inputs.dry-run
        run: echo "count=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Version pull request
        if: steps.pending.outputs.count != '0' && steps.pending.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B changeset-release/master
          bun run changeset version
          git add -A
          git commit -m "chore(release): version packages"
          git push --force origin changeset-release/master
          if [ -z "$(gh pr list --head changeset-release/master --state open --json number --jq '.[].number')" ]; then
            gh pr create --base master --head changeset-release/master --title "chore(release): version packages" --body "Merging this publishes the versioned packages to npm." || echo "::warning::Could not open the version pull request; open it by hand from changeset-release/master"
          fi
      - name: Publish
        if: steps.pending.outputs.count == '0'
        run: |
          bun run release | tee release.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in $(sed -n 's/^New tag: //p' release.log); do
            git tag "$tag"
            git push origin "$tag"
          done
